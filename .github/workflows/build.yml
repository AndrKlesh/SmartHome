name: Build

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: '9.0.x'

      - name: Build .NET projects
        run: dotnet build --configuration Release

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 'latest'

      - name: Install SmartHomeGUI dependencies
        working-directory: SmartHome/src/SmartHomeGUI
        run: npm ci

      - name: Build SmartHomeGUI with Webpack
        working-directory: SmartHome/src/SmartHomeGUI
        run: npm run build

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: '9.0.x'

      - name: Build .NET projects
        run: dotnet build --configuration Release

      - name: Run tests
        run: dotnet test --configuration Release
